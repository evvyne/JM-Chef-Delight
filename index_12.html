<title>JM Chef Delight</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#FAF7F1;
  --paper-raised:#FFFFFF;
  --ink:#241F19;
  --ink-soft:#5B5347;
  --line:#E6DFD2;
  --accent:#C8710A;
  --accent-ink:#5A3306;
  --accent-soft:#F4E3C8;
  --good:#5F7A4D;
  --good-soft:#E4EBDB;
  --bad:#AA4426;
  --bad-soft:#F5DFD3;
  --shadow: 0 1px 2px rgba(36,31,25,.06), 0 6px 16px -8px rgba(36,31,25,.18);
  font-variant-numeric: tabular-nums;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1712;
    --paper-raised:#252019;
    --ink:#F3EEE4;
    --ink-soft:#B5AB9A;
    --line:#3A3327;
    --accent:#E28A2A;
    --accent-ink:#FBE3BC;
    --accent-soft:#3D2C13;
    --good:#8FAE74;
    --good-soft:#26301E;
    --bad:#D97C5C;
    --bad-soft:#3A2418;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1712;
  --paper-raised:#252019;
  --ink:#F3EEE4;
  --ink-soft:#B5AB9A;
  --line:#3A3327;
  --accent:#E28A2A;
  --accent-ink:#FBE3BC;
  --accent-soft:#3D2C13;
  --good:#8FAE74;
  --good-soft:#26301E;
  --bad:#D97C5C;
  --bad-soft:#3A2418;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Public Sans', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper);}

/* header */
header.top{
  padding:20px 18px 14px; display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:1px solid var(--line);
}
header.top h1{
  font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem; margin:0;
  letter-spacing:-0.01em;
}
header.top .date{font-size:.8rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

/* main scroll area */
main{flex:1; padding:16px 16px 90px; display:flex; flex-direction:column; gap:18px;}

/* dashboard summary */
.summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.summary-grid .wide{grid-column:1 / -1;}
.tile{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.tile .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
.tile .value{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.5rem; margin-top:4px;}
.tile.profit .value{color:var(--good);}
.tile.profit.negative .value{color:var(--bad);}
.tile .sub{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}

.section-title{
  font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; margin:2px 0 -6px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-title .count{font-family:'Public Sans'; font-size:.72rem; font-weight:600; color:var(--ink-soft); background:var(--paper-raised); border:1px solid var(--line); border-radius:999px; padding:2px 9px;}

/* low stock */
.alert-list{display:flex; flex-direction:column; gap:8px;}
.alert-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--bad-soft); border:1px solid transparent; border-radius:10px; padding:10px 12px;
  font-size:.85rem;
}
.alert-row .name{font-weight:600;}
.alert-row .qty{font-family:'IBM Plex Mono',monospace; color:var(--bad); font-weight:600; font-size:.8rem;}
.empty-note{font-size:.82rem; color:var(--ink-soft); padding:2px 2px;}

/* forms */
form.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
  padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.row3{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px;}
input,select{
  font:inherit; font-size:.95rem; padding:9px 10px; border-radius:9px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  width:100%;
}
input:focus,select:focus,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
button.primary{
  font:inherit; font-weight:600; font-size:.9rem; padding:10px 14px; border-radius:9px;
  border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;
}
button.primary:hover{filter:brightness(1.05);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#241708;}}
:root[data-theme="dark"] button.primary{color:#241708;}

/* list rows */
.list{display:flex; flex-direction:column; gap:8px;}
.item-row{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
  padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.item-row .main{display:flex; flex-direction:column; gap:2px; min-width:0;}
.item-row .main .t{font-weight:600; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-row .main .s{font-size:.76rem; color:var(--ink-soft);}
.item-row .right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.item-row .amt{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.92rem;}
.amt.good{color:var(--good);}
.amt.bad{color:var(--bad);}
.del-btn{
  border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:1.1rem;
  padding:2px 4px; line-height:1; border-radius:6px;
}
.del-btn:hover{color:var(--bad); background:var(--bad-soft);}
.pill{
  font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;
}
.pill.stock-ok{background:var(--good-soft); color:var(--good);}
.pill.stock-low{background:var(--bad-soft); color:var(--bad);}

/* tabs */
nav.tabs{
  position:sticky; bottom:0; left:0; right:0;
  background:var(--paper-raised); border-top:1px solid var(--line);
  display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  gap:4px;
}
nav.tabs button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:transparent; border:none; padding:8px 4px 6px; border-radius:10px;
  color:var(--ink-soft); font:inherit; font-size:.68rem; font-weight:600; cursor:pointer;
  letter-spacing:.01em;
}
nav.tabs button .ic{font-size:1.15rem; line-height:1;}
nav.tabs button.active{color:var(--accent); background:var(--accent-soft);}

.view{display:none; flex-direction:column; gap:18px;}
.view.active{display:flex;}

.muted-small{font-size:.72rem; color:var(--ink-soft); line-height:1.4;}
</style>

<div class="app">
  <header class="top">
    <h1>JM Chef Delight</h1>
    <span class="date" id="todayLabel"></span>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section class="view active" id="view-dashboard">
      <div class="summary-grid">
        <div class="tile"><div class="label">Revenue today</div><div class="value" id="sumRevenue">—</div></div>
        <div class="tile"><div class="label">Cost today</div><div class="value" id="sumCost">—</div></div>
        <div class="tile profit wide" id="profitTile"><div class="label">Profit today</div><div class="value" id="sumProfit">—</div><div class="sub" id="profitSub"></div></div>
        <div class="tile"><div class="label">Waste (7d)</div><div class="value" id="sumWaste">—</div></div>
        <div class="tile"><div class="label">Stock value</div><div class="value" id="sumStockValue">—</div></div>
      </div>

      <div>
        <div class="section-title">Low stock<span class="count" id="lowStockCount">0</span></div>
        <div class="alert-list" id="lowStockList" style="margin-top:8px;"></div>
      </div>

      <div>
        <div class="section-title">Recent activity</div>
        <div class="list" id="recentList" style="margin-top:8px;"></div>
      </div>
    </section>

    <!-- INVENTORY -->
    <section class="view" id="view-inventory">
      <form class="card" id="invForm">
        <div class="section-title" style="margin-bottom:2px;">Add / restock item</div>
        <div class="row2">
          <div class="field"><label for="invName">Item</label><input id="invName" placeholder="e.g. Chicken thigh" required></div>
          <div class="field"><label for="invUnit">Unit</label><input id="invUnit" placeholder="kg, pcs, L" required></div>
        </div>
        <div class="row3">
          <div class="field"><label for="invQty">Qty added</label><input id="invQty" type="number" step="0.01" min="0" required></div>
          <div class="field"><label for="invCost">Unit cost (RM)</label><input id="invCost" type="number" step="0.01" min="0" required></div>
          <div class="field"><label for="invReorder">Reorder at</label><input id="invReorder" type="number" step="0.01" min="0" placeholder="optional"></div>
        </div>
        <button class="primary" type="submit">Add stock</button>
      </form>

      <div>
        <div class="section-title">Current inventory<span class="count" id="invCount">0</span></div>
        <div class="list" id="invList" style="margin-top:8px;"></div>
      </div>
    </section>

    <!-- ORDERS -->
    <section class="view" id="view-orders">
      <form class="card" id="orderForm">
        <div class="section-title" style="margin-bottom:2px;">Log a sale</div>
        <div class="field"><label for="orderItem">Menu item</label><input id="orderItem" placeholder="e.g. Smash burger" required></div>
        <div class="row3">
          <div class="field"><label for="orderQty">Qty sold</label><input id="orderQty" type="number" step="1" min="1" value="1" required></div>
          <div class="field"><label for="orderPrice">Price each (RM)</label><input id="orderPrice" type="number" step="0.01" min="0" required></div>
          <div class="field"><label for="orderCost">Cost each (RM)</label><input id="orderCost" type="number" step="0.01" min="0" placeholder="optional"></div>
        </div>
        <button class="primary" type="submit">Log sale</button>
      </form>

      <div>
        <div class="section-title">Today's orders<span class="count" id="orderCount">0</span></div>
        <div class="list" id="orderList" style="margin-top:8px;"></div>
      </div>
    </section>

    <!-- WASTAGE -->
    <section class="view" id="view-wastage">
      <form class="card" id="wasteForm">
        <div class="section-title" style="margin-bottom:2px;">Log wastage</div>
        <div class="row2">
          <div class="field"><label for="wasteItem">Item</label><input id="wasteItem" placeholder="e.g. Chicken thigh" required></div>
          <div class="field"><label for="wasteQty">Qty lost</label><input id="wasteQty" type="number" step="0.01" min="0" required></div>
        </div>
        <div class="row2">
          <div class="field"><label for="wasteCost">Unit cost (RM)</label><input id="wasteCost" type="number" step="0.01" min="0" placeholder="optional"></div>
          <div class="field"><label for="wasteReason">Reason</label>
            <select id="wasteReason">
              <option>Expired</option>
              <option>Spoiled</option>
              <option>Prep error</option>
              <option>Dropped/damaged</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <button class="primary" type="submit">Log wastage</button>
      </form>

      <div>
        <div class="section-title">Recent wastage<span class="count" id="wasteCount">0</span></div>
        <div class="list" id="wasteList" style="margin-top:8px;"></div>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab-btn active" data-view="dashboard"><span class="ic">◈</span>Dashboard</button>
    <button class="tab-btn" data-view="inventory"><span class="ic">▤</span>Inventory</button>
    <button class="tab-btn" data-view="orders"><span class="ic">✎</span>Orders</button>
    <button class="tab-btn" data-view="wastage"><span class="ic">⚠</span>Wastage</button>
  </nav>
</div>

<script>
(function(){
  "use strict";
  var CUR = "RM";
  var todayStr = function(){ return new Date().toISOString().slice(0,10); };
  var fmt = function(n){ return CUR + " " + (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); };
  var fmtDate = function(d){
    return new Date(d).toLocaleDateString('en-MY', {weekday:'short', day:'numeric', month:'short'});
  };

  // ---- storage ----
  var STORE_KEY = "truckledger_v1";
  var seedData = function(){
    var today = todayStr();
    return {
      inventory: [
        {id:"i1", name:"Chicken thigh", unit:"kg", qty:8.5, unitCost:14.5, reorder:4},
        {id:"i2", name:"Burger buns", unit:"pcs", qty:22, unitCost:0.9, reorder:20},
        {id:"i3", name:"Fries (frozen)", unit:"kg", qty:11, unitCost:6.2, reorder:5}
      ],
      orders: [
        {id:"o1", date:today, item:"Smash burger", qty:14, price:16, cost:6.5},
        {id:"o2", date:today, item:"Loaded fries", qty:9, price:12, cost:4}
      ],
      wastage: [
        {id:"w1", date:today, item:"Burger buns", qty:3, unitCost:0.9, reason:"Dropped/damaged"}
      ]
    };
  };

  var data;
  try{
    var raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : seedData();
  }catch(e){ data = seedData(); }
  var isExample = !localStorage.getItem(STORE_KEY);

  var save = function(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
  };
  if(isExample) save();

  var uid = function(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); };

  // ---- tabs ----
  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
    });
  });

  document.getElementById('todayLabel').textContent = fmtDate(todayStr());

  // ---- inventory logic ----
  function findInv(name){
    var n = name.trim().toLowerCase();
    return data.inventory.find(function(i){ return i.name.toLowerCase() === n; });
  }

  function renderInventory(){
    var list = document.getElementById('invList');
    document.getElementById('invCount').textContent = data.inventory.length;
    if(!data.inventory.length){
      list.innerHTML = '<div class="empty-note">No inventory yet. Add your first item above.</div>';
      return;
    }
    var sorted = data.inventory.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    list.innerHTML = sorted.map(function(i){
      var low = i.reorder != null && i.qty <= i.reorder;
      return '<div class="item-row">' +
        '<div class="main"><div class="t">' + esc(i.name) + '</div>' +
        '<div class="s">' + i.qty.toFixed(2) + ' ' + esc(i.unit) + ' on hand · ' + fmt(i.unitCost) + '/' + esc(i.unit) + '</div></div>' +
        '<div class="right">' +
          '<span class="pill ' + (low ? 'stock-low' : 'stock-ok') + '">' + (low ? 'Low' : 'OK') + '</span>' +
          '<button class="del-btn" data-del-inv="' + i.id + '" title="Remove item">✕</button>' +
        '</div></div>';
    }).join('');
  }

  document.getElementById('invForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('invName').value.trim();
    var unit = document.getElementById('invUnit').value.trim();
    var qty = parseFloat(document.getElementById('invQty').value);
    var cost = parseFloat(document.getElementById('invCost').value);
    var reorderRaw = document.getElementById('invReorder').value;
    var reorder = reorderRaw === '' ? null : parseFloat(reorderRaw);
    if(!name || isNaN(qty) || isNaN(cost)) return;

    var existing = findInv(name);
    if(existing){
      existing.qty += qty;
      existing.unitCost = cost;
      if(reorder != null) existing.reorder = reorder;
    } else {
      data.inventory.push({id:uid('i'), name:name, unit:unit || 'unit', qty:qty, unitCost:cost, reorder:reorder});
    }
    save();
    this.reset();
    renderAll();
  });

  document.getElementById('invList').addEventListener('click', function(e){
    var btn = e.target.closest('[data-del-inv]');
    if(!btn) return;
    data.inventory = data.inventory.filter(function(i){ return i.id !== btn.dataset.delInv; });
    save(); renderAll();
  });

  // ---- orders logic ----
  function renderOrders(){
    var today = todayStr();
    var list = document.getElementById('orderList');
    var todays = data.orders.filter(function(o){ return o.date === today; })
      .slice().sort(function(a,b){ return b.id.localeCompare(a.id); });
    document.getElementById('orderCount').textContent = todays.length;
    if(!todays.length){
      list.innerHTML = '<div class="empty-note">No sales logged today yet.</div>';
      return;
    }
    list.innerHTML = todays.map(function(o){
      var rev = o.qty * o.price;
      return '<div class="item-row">' +
        '<div class="main"><div class="t">' + esc(o.item) + '</div>' +
        '<div class="s">' + o.qty + ' × ' + fmt(o.price) + '</div></div>' +
        '<div class="right"><span class="amt good">' + fmt(rev) + '</span>' +
        '<button class="del-btn" data-del-order="' + o.id + '" title="Remove">✕</button></div></div>';
    }).join('');
  }

  document.getElementById('orderForm').addEventListener('submit', function(e){
    e.preventDefault();
    var item = document.getElementById('orderItem').value.trim();
    var qty = parseFloat(document.getElementById('orderQty').value);
    var price = parseFloat(document.getElementById('orderPrice').value);
    var costRaw = document.getElementById('orderCost').value;
    var cost = costRaw === '' ? 0 : parseFloat(costRaw);
    if(!item || isNaN(qty) || isNaN(price)) return;
    data.orders.push({id:uid('o'), date:todayStr(), item:item, qty:qty, price:price, cost:cost});
    save();
    this.reset();
    document.getElementById('orderQty').value = 1;
    renderAll();
  });

  document.getElementById('orderList').addEventListener('click', function(e){
    var btn = e.target.closest('[data-del-order]');
    if(!btn) return;
    data.orders = data.orders.filter(function(o){ return o.id !== btn.dataset.delOrder; });
    save(); renderAll();
  });

  // ---- wastage logic ----
  function renderWastage(){
    var list = document.getElementById('wasteList');
    var sorted = data.wastage.slice().sort(function(a,b){ return b.id.localeCompare(a.id); }).slice(0,30);
    document.getElementById('wasteCount').textContent = data.wastage.length;
    if(!sorted.length){
      list.innerHTML = '<div class="empty-note">No wastage logged. Nice.</div>';
      return;
    }
    list.innerHTML = sorted.map(function(w){
      var loss = w.qty * (w.unitCost || 0);
      return '<div class="item-row">' +
        '<div class="main"><div class="t">' + esc(w.item) + '</div>' +
        '<div class="s">' + fmtDate(w.date) + ' · ' + w.qty + ' · ' + esc(w.reason) + '</div></div>' +
        '<div class="right"><span class="amt bad">-' + fmt(loss) + '</span>' +
        '<button class="del-btn" data-del-waste="' + w.id + '" title="Remove">✕</button></div></div>';
    }).join('');
  }

  document.getElementById('wasteForm').addEventListener('submit', function(e){
    e.preventDefault();
    var item = document.getElementById('wasteItem').value.trim();
    var qty = parseFloat(document.getElementById('wasteQty').value);
    var costRaw = document.getElementById('wasteCost').value;
    var reason = document.getElementById('wasteReason').value;
    if(!item || isNaN(qty)) return;
    var unitCost = costRaw === '' ? 0 : parseFloat(costRaw);
    var inv = findInv(item);
    if(unitCost === 0 && inv) unitCost = inv.unitCost;
    if(inv) inv.qty = Math.max(0, inv.qty - qty);
    data.wastage.push({id:uid('w'), date:todayStr(), item:item, qty:qty, unitCost:unitCost, reason:reason});
    save();
    this.reset();
    renderAll();
  });

  document.getElementById('wasteList').addEventListener('click', function(e){
    var btn = e.target.closest('[data-del-waste]');
    if(!btn) return;
    data.wastage = data.wastage.filter(function(w){ return w.id !== btn.dataset.delWaste; });
    save(); renderAll();
  });

  // ---- dashboard ----
  function renderDashboard(){
    var today = todayStr();
    var todaysOrders = data.orders.filter(function(o){ return o.date === today; });
    var revenue = todaysOrders.reduce(function(s,o){ return s + o.qty*o.price; }, 0);
    var cost = todaysOrders.reduce(function(s,o){ return s + o.qty*(o.cost||0); }, 0);
    var profit = revenue - cost;

    document.getElementById('sumRevenue').textContent = fmt(revenue);
    document.getElementById('sumCost').textContent = fmt(cost);
    document.getElementById('sumProfit').textContent = fmt(profit);
    var tile = document.getElementById('profitTile');
    tile.classList.toggle('negative', profit < 0);
    document.getElementById('profitSub').textContent = todaysOrders.length + ' sale' + (todaysOrders.length===1?'':'s') + ' logged today';

    var sevenAgo = new Date(); sevenAgo.setDate(sevenAgo.getDate()-6);
    var sevenStr = sevenAgo.toISOString().slice(0,10);
    var wasteTotal = data.wastage.filter(function(w){ return w.date >= sevenStr; })
      .reduce(function(s,w){ return s + w.qty*(w.unitCost||0); }, 0);
    document.getElementById('sumWaste').textContent = fmt(wasteTotal);

    var stockValue = data.inventory.reduce(function(s,i){ return s + i.qty*i.unitCost; }, 0);
    document.getElementById('sumStockValue').textContent = fmt(stockValue);

    var low = data.inventory.filter(function(i){ return i.reorder != null && i.qty <= i.reorder; });
    document.getElementById('lowStockCount').textContent = low.length;
    var lowEl = document.getElementById('lowStockList');
    lowEl.innerHTML = low.length ? low.map(function(i){
      return '<div class="alert-row"><span class="name">' + esc(i.name) + '</span>' +
        '<span class="qty">' + i.qty.toFixed(2) + ' ' + esc(i.unit) + ' left (reorder at ' + i.reorder + ')</span></div>';
    }).join('') : '<div class="empty-note">Everything is stocked above its reorder point.</div>';

    var events = [];
    todaysOrders.forEach(function(o){ events.push({t:'sale', label:o.item + ' × ' + o.qty, amt:o.qty*o.price, id:o.id}); });
    data.wastage.filter(function(w){ return w.date === today; }).forEach(function(w){ events.push({t:'waste', label:w.item + ' wasted', amt:-(w.qty*(w.unitCost||0)), id:w.id}); });
    events.sort(function(a,b){ return b.id.localeCompare(a.id); });
    var recEl = document.getElementById('recentList');
    recEl.innerHTML = events.length ? events.slice(0,8).map(function(ev){
      return '<div class="item-row"><div class="main"><div class="t">' + esc(ev.label) + '</div>' +
        '<div class="s">' + (ev.t==='sale' ? 'Order logged' : 'Wastage logged') + '</div></div>' +
        '<div class="right"><span class="amt ' + (ev.amt>=0?'good':'bad') + '">' + (ev.amt>=0?'':'-') + fmt(Math.abs(ev.amt)) + '</span></div></div>';
    }).join('') : '<div class="empty-note">No activity yet today — log a sale or restock to get started.</div>';
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderAll(){
    renderDashboard();
    renderInventory();
    renderOrders();
    renderWastage();
  }
  renderAll();
})();
</script>
